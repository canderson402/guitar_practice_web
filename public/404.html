<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Guitar Practice</title>
  <script>
    // GitHub Pages SPA redirect. Converts deep-link 404s into hash-encoded
    // paths that index.html unpacks into the real path via history.replaceState.
    // Source: https://github.com/rafgraph/spa-github-pages (MIT)
    var segmentCount = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
